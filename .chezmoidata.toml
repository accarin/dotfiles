# =============================================================================
# vaultlet (local secret manager, `vlt` CLI) — opt-in per machine.
# =============================================================================

# Global default — vaultlet is not managed unless enabled per machine.
# When enabled, run_onchange_before_setup-00-vaultlet.sh.tmpl installs vaultlet
# following vaultlet's QUICKSTART.md ONLY if no trace of an installation exists
# (state file, config/data dirs, systemd units, service account, client config).
# An existing or half-installed vaultlet is never modified, purged or reinstalled.
# Other chezmoi scripts (e.g. DoT) read their secrets from it via `vlt`.
[vaultlet]
enabled           = false
# native | docker | podman. Cannot be changed on an existing installation
# without a manual `vlt apply vaultlet --delete --purge`.
installation_type = "native"
# latest-stable | latest-prerelease | an exact version such as "26.9.1"
version           = "latest-prerelease"
# Identity name of the client enrolled for this user.
client_name       = "admin-client"

# Per-machine overrides, keyed by hostname (any of the keys above).
[machines.deep-thought.vaultlet]
enabled           = true

# Per-machine overrides, keyed by hostname (any of the keys above).
[machines.hitchhiker.vaultlet]
enabled           = true

