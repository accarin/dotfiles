# mpv options for jellyfin-mpv-shim (it reads only this dir, not ~/.config/mpv).
# The shim never sets vo or colour options itself, so these decide HDR.

# Already mpv 0.41's default; pinned because target-colorspace-hint needs it
vo=gpu-next
# Same API as the standalone-mpv test that switched the LG to HDR
gpu-api=vulkan
# Always send the PQ/BT.2020 hint so Hyprland's cm_auto_hdr switches the LG to HDR (fullscreen only)
target-colorspace-hint=yes
